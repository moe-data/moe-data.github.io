name: Update selected timeperiod

on:
  schedule:
    - cron: "0 20 1 * *"
  push:
    paths:
      - "**/update-selected-timeperiod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timeperiod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update timetable month keys
        id: update
        shell: bash
        run: |
          current_month="$(date -u +%Y%m)"
          previous_month="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y%m)"
          echo "current_month=$current_month" >> "$GITHUB_OUTPUT"
          echo "previous_month=$previous_month" >> "$GITHUB_OUTPUT"
          export CURRENT_MONTH="$current_month"
          export PREVIOUS_MONTH="$previous_month"

      - name: Update dist/timetables.json with dump size counts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const months = ['202601', '202602', '202603']
          const sizeC = JSON.parse(fs.readFileSync('dump/size-c.json', 'utf8'))
          const sizeD = JSON.parse(fs.readFileSync('dump/size-d.json', 'utf8'))
          const timetablePath = 'dist/timetables.json'
          const timetable = JSON.parse(fs.readFileSync(timetablePath, 'utf8'))

          months.forEach((month) => {
            const cLen = Number(sizeC[`${month}-length`])
            const dLen = Number(sizeD[`${month}-length`])
            if (Number.isNaN(cLen) || Number.isNaN(dLen)) {
              throw new Error(`Missing size-c/size-d length for ${month}: c=${sizeC[`${month}-length`]} d=${sizeD[`${month}-length`]}`)
            }
            const shipRow = timetable.ship.find((row) => String(row[0]) === month)
            const equipRow = timetable.equipment.find((row) => String(row[0]) === month)
            if (!shipRow || !equipRow) {
              throw new Error(`Missing ${month} row in dist/timetables.json`)
            }
            shipRow[1] = cLen
            equipRow[1] = dLen
          })

          fs.writeFileSync(timetablePath, JSON.stringify(timetable, null, 2) + '\n', 'utf8')
          console.log('Updated dist/timetables.json for', months.join(', '))
          NODE

      - name: Show computed months and diff
        shell: bash
        run: |
          echo "Previous month: ${{ steps.update.outputs.previous_month }}"
          echo "Current month:  ${{ steps.update.outputs.current_month }}"
          git --no-pager diff -- dist/timetables.json 

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- dist/timetables.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit updated timeperiod
        if: steps.changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update selected time period month keys"
          file_pattern:  dist/timetables.json 
