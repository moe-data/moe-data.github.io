name: Convert api_mst_ship to ship.json

on:
  push:
    paths:
      - 'parsed/api_mst_ship.json'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert JSON
        run: node .github/actions/ships.js

      - name: Commit changes if any
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add parsed/ship.json || true
          git commit -m "Auto-convert api_mst_ship.json to ship.json" || echo "No changes to commit"
          git push